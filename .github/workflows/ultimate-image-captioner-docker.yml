name: Build Ultimate Image Captioner image

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ultimate_image_captioner_v1_2/Dockerfile"
      - "ultimate_image_captioner_v1_2/requirements_premium_caption.txt"
      - "ultimate_image_captioner_v1_2/HF_model_downloader.py"
      - "ultimate_image_captioner_v1_2/batch-caption-qwen.py"
      - "ultimate_image_captioner_v1_2/start.sh"
      - "ultimate_image_captioner_v1_2/launch-captioner.sh"
      - "ultimate_image_captioner_v1_2/captionerctl.sh"
      - "ultimate_image_captioner_v1_2/download-models.sh"
      - "ultimate_image_captioner_v1_2/telegram-notify.sh"
      - "ultimate_image_captioner_v1_2/captioner-bootstrap.sh"
      - "ultimate_image_captioner_v1_2/captioner-nag.sh"
      - ".github/workflows/ultimate-image-captioner-docker.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ultimate_image_captioner_v1_2
          file: ./ultimate_image_captioner_v1_2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            markwelshboy/ultimate_image_captioner:1.2
            markwelshboy/ultimate_image_captioner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
